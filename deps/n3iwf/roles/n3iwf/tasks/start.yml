---

- name: check if servers and config server length are equal
  fail:
    msg: "Mismatch in number of servers and n3iwf nodes: {{ n3iwf.servers|length }} vs {{ groups['n3iwf_nodes']|length }}"
  when: n3iwf.servers|length != groups['n3iwf_nodes']|length

- name: Preflight | Docker CPU availability for N3IWF
  ansible.builtin.include_role:
    name: preflight
    tasks_from: docker_cpu
  vars:
    preflight_label: "N3IWF"
    preflight_min_cpus: "{{ n3iwf.docker.preflight.min_cpus }}"
    preflight_probe_image: "{{ n3iwf.docker.preflight.probe_image }}"
    preflight_enabled: "{{ n3iwf.docker.preflight.enabled }}"
  when: inventory_hostname in groups['n3iwf_nodes']

- name: ensure {{ n3iwf.docker.image }} image is present
  # `source: local` reuses the image staged into Docker by the
  # bundle's dockerimages step. Online installs still pull.
  community.docker.docker_image:
    name: "{{ n3iwf.docker.image }}"
    source: "{{ 'local' if airgapped.enabled | default(false) | bool else 'pull' }}"
  when: inventory_hostname in groups['n3iwf_nodes']
  become: true

# The config, the private key and the certificate all lived in /tmp, which is
# world-writable (1777) and does not survive a reboot. The key generation below
# is guarded by `creates:`, so with the key in /tmp an unprivileged local user
# could place /tmp/n3iwf.key first, keep ownership of it, have the generation
# skip, and have the role mount their key into the container as its identity.
# A root-owned 0700 directory removes that window: only root can place a file
# there, so `creates:` is safe to keep for idempotency.
- name: create the N3IWF state directory
  file:
    path: /var/lib/n3iwf
    state: directory
    owner: root
    group: root
    # holds the private key, so not traversable by anyone else
    mode: '0700'
  when: inventory_hostname in groups['n3iwf_nodes']
  become: true

- name: render the n3iwf config to /var/lib/n3iwf/n3iwf-config.yaml
  template:
    src: "{{ ROOT_DIR }}/{{ n3iwf.servers[server_index | int].conf_file }}"
    dest: /var/lib/n3iwf/n3iwf-config.yaml
    owner: root
    group: root
    mode: '0644'
  vars:
    server_index: "{{ groups['n3iwf_nodes'].index(inventory_hostname) }}"
    n3iwf_ip: "{{ n3iwf.servers[server_index | int].n3iwf_ip }}"
    nwu_ip: "{{ n3iwf.servers[server_index | int].nwu_ip }}"
    n2_ip: "{{ n3iwf.servers[server_index | int].n2_ip }}"
    n3_ip: "{{ n3iwf.servers[server_index | int].n3_ip }}"
    n3iwf_id: "{{ (groups['n3iwf_nodes'].index(inventory_hostname) | int) + 101 }}"
  when: inventory_hostname in groups['n3iwf_nodes']
  become: true

- name: generate private key
  command: >
    openssl genrsa -out /var/lib/n3iwf/n3iwf.key 2048
  args:
    creates: "/var/lib/n3iwf/n3iwf.key"
  when: inventory_hostname in groups['n3iwf_nodes']
  become: true

# openssl already writes 0600, but state it rather than depend on it, and
# correct a key carried over from an earlier layout.
- name: enforce ownership and mode on the private key
  file:
    path: /var/lib/n3iwf/n3iwf.key
    owner: root
    group: root
    mode: '0600'
  when: inventory_hostname in groups['n3iwf_nodes']
  become: true

- name: generate self-signed certificate
  command: >
    openssl req -new -x509 -key /var/lib/n3iwf/n3iwf.key -out /var/lib/n3iwf/n3iwf.crt -days 365 -subj "/C=US/ST=State/L=City/O=Organization/OU=Unit/CN=aetherproject.org"
  args:
    creates: "/var/lib/n3iwf/n3iwf.crt"
  when: inventory_hostname in groups['n3iwf_nodes']
  become: true

- name: create {{ n3iwf.docker.image }} containers
  community.docker.docker_container:
    name: "n3iwf"
    image: "{{ n3iwf.docker.image }}"
    command: n3iwf -cfg /etc/n3iwf/n3iwf-config.yaml
    networks:
      - name: "{{ n3iwf.docker.network.name }}"
    volumes:
      # one directory mount instead of three single-file mounts
      - /var/lib/n3iwf:/etc/n3iwf
    privileged: true
    state: started
    detach: true
  when: inventory_hostname in groups['n3iwf_nodes']
  become: true
