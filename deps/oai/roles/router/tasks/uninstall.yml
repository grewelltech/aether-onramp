---

# The UPF's subnets and gateways come from the shared resolver (see
# deps/common/roles/preflight/tasks/upf_networks.yml) so this role and the
# 5gc roles read one description of the UPF's networking.
- name: resolve UPF networking
  import_role:
    name: preflight
    tasks_from: upf_networks.yml
  vars:
    upf_networks_strict: false

# The install rendered its data interface into the rules file; when
# oai.docker.network.data_iface is empty, that interface is the one to clean
# up, which the default route may no longer point at.
- name: read the iptables rules file the install wrote
  ansible.builtin.slurp:
    src: /etc/iptables/oai-rules.v4
  register: oai_rules_file
  failed_when: false
  changed_when: false
  become: true
  when: inventory_hostname in groups['oai_nodes']

- name: recover the data interface the install used from the rules file
  ansible.builtin.set_fact:
    oai_recorded_data_iface: >-
      {{ (oai_rules_file.content | b64decode)
         | regex_findall('(?m)^-A FORWARD -i ([^ ]+) -o ' ~ (oai.docker.network.bridge.name | regex_escape) ~ ' ')
         | difference(['access']) | first | default('') }}
  when:
    - inventory_hostname in groups['oai_nodes']
    - oai_rules_file.content is defined

# oai.docker.network.data_iface is resolved into `ran_data_iface` and
# `ran_data_address` (see deps/common/roles/preflight/tasks/ran_data_iface.yml):
# an empty value means the interface the install recorded, or failing that the
# default-route interface.
- name: resolve oai.docker.network.data_iface
  import_role:
    name: preflight
    tasks_from: ran_data_iface.yml
  vars:
    preflight_label: oai.docker.network.data_iface
    preflight_ran_data_iface: "{{ oai.docker.network.data_iface | default('', true) or oai_recorded_data_iface | default('') }}"
    preflight_ran_data_iface_origin: "{{ 'configured' if oai.docker.network.data_iface | default('', true) else 'recorded by the install' }}"
    preflight_strict: false
  when: inventory_hostname in groups['oai_nodes']

- name: check if servers and config server length are equal
  fail:
    msg: "Mismatch in number of servers and oai nodes: {{ oai.servers|length }} vs {{ groups['oai_nodes']|length }}"
  when: oai.servers|length != groups['oai_nodes']|length

- name: "remove a static route on oai host for {{ upf_instances.default.access.subnet }} via {{ core.amf.ip }}"
  command:
    argv:
      - ip
      - route
      - del
      - "{{ upf_instances.default.access.subnet }}"
      - via
      - "{{ core.amf.ip }}"
  when: (inventory_hostname in groups['oai_nodes']) and (inventory_hostname not in groups['master_nodes']) and upf_instances.default.access.host_gateway
  become: true
  ignore_errors: yes

- name: "remove a static route on core host for {{ oai.docker.network.subnet }} via {{ hostvars[item]['ran_data_address'] }}"
  command:
    argv:
      - ip
      - route
      - del
      - "{{ oai.docker.network.subnet }}"
      - via
      - "{{ hostvars[item]['ran_data_address'] }}"
  with_items: "{{ play_hosts | intersect(groups['oai_nodes']) | difference(groups['master_nodes']) }}"
  when: (inventory_hostname in groups['master_nodes']) and oai.docker.network.name != "host"
  become: true
  ignore_errors: yes

# Installs before ran_data_address routed via the node's default-route address.
- name: "remove a static route an earlier install added on core host for {{ oai.docker.network.subnet }} via {{ hostvars[item]['ansible_default_ipv4']['address'] }}"
  command:
    argv:
      - ip
      - route
      - del
      - "{{ oai.docker.network.subnet }}"
      - via
      - "{{ hostvars[item]['ansible_default_ipv4']['address'] }}"
  with_items: "{{ play_hosts | intersect(groups['oai_nodes']) | difference(groups['master_nodes']) }}"
  when:
    - inventory_hostname in groups['master_nodes']
    - oai.docker.network.name != "host"
    - hostvars[item]['ansible_default_ipv4']['address'] is defined
    - hostvars[item]['ansible_default_ipv4']['address'] != hostvars[item]['ran_data_address']
  become: true
  ignore_errors: yes

- name: stop oai-iptables.service
  systemd:
    name: oai-iptables.service
    state: stopped
  when: inventory_hostname in groups['oai_nodes'] and oai.docker.network.name != "host"
  become: true
  ignore_errors: yes

- name: disable oai-iptables.service
  systemd:
    name: oai-iptables.service
    enabled: false
  when: inventory_hostname in groups['oai_nodes'] and oai.docker.network.name != "host"
  become: true
  ignore_errors: yes

- name: delete /etc/systemd/system/oai-iptables.service
  file:
    path: /etc/systemd/system/oai-iptables.service
    state: absent
  when: inventory_hostname in groups['oai_nodes'] and oai.docker.network.name != "host"
  become: true
  ignore_errors: yes

- name: delete persistent oai iptables rules file
  file:
    path: /etc/iptables/oai-rules.v4
    state: absent
  when: inventory_hostname in groups['oai_nodes'] and oai.docker.network.name != "host"
  become: true
  ignore_errors: yes

- name: "remove iptable rule: forward from access to {{ oai.docker.network.bridge.name }}"
  iptables:
    chain: FORWARD
    in_interface: "access"
    out_interface: "{{ oai.docker.network.bridge.name }}"
    jump: ACCEPT
    state: absent
  when: (inventory_hostname in groups['oai_nodes']) and (inventory_hostname in groups['master_nodes']) and oai.docker.network.name != "host"
  become: true
  ignore_errors: yes

- name: "remove iptable rule: forward from {{ oai.docker.network.bridge.name }} to access"
  iptables:
    chain: FORWARD
    in_interface: "{{ oai.docker.network.bridge.name }}"
    out_interface: "access"
    jump: ACCEPT
    state: absent
  when: (inventory_hostname in groups['oai_nodes']) and (inventory_hostname in groups['master_nodes']) and oai.docker.network.name != "host"
  become: true
  ignore_errors: yes

- name: "remove iptable rule: forward from {{ ran_data_iface }} to {{ oai.docker.network.bridge.name }} "
  iptables:
    chain: FORWARD
    in_interface: "{{ ran_data_iface }}"
    out_interface: "{{ oai.docker.network.bridge.name }}"
    jump: ACCEPT
    state: absent
  when: inventory_hostname in groups['oai_nodes'] and oai.docker.network.name != "host"
  become: true

- name: "delete iptable rule: forward from {{ oai.docker.network.bridge.name }} to {{ ran_data_iface }}"
  iptables:
    chain: FORWARD
    in_interface: "{{ oai.docker.network.bridge.name }}"
    out_interface: "{{ ran_data_iface }}"
    jump: ACCEPT
    state: absent
  when: inventory_hostname in groups['oai_nodes'] and oai.docker.network.name != "host"
  become: true

- name: delete {{ oai.docker.network.name }} network
  community.docker.docker_network:
    name: "{{ oai.docker.network.name }}"
    state: absent
    force: yes
  when: inventory_hostname in groups['oai_nodes'] and oai.docker.network.name != "host"
  become: true

- name: set net.ipv4.conf.all.arp_filter to 0
  ansible.posix.sysctl:
    name: net.ipv4.conf.all.arp_filter
    value: '0'
    sysctl_set: true
    reload: true
  when: (inventory_hostname in groups['oai_nodes']) and (inventory_hostname not in groups['master_nodes'])
  become: true

- name: set net.ipv4.conf.all.arp_ignore to 0
  ansible.posix.sysctl:
    name: net.ipv4.conf.all.arp_ignore
    value: '0'
    sysctl_set: true
    reload: true
  when: (inventory_hostname in groups['oai_nodes']) and (inventory_hostname not in groups['master_nodes'])
  become: true

- name: set net.ipv4.conf.all.arp_announce to 0
  ansible.posix.sysctl:
    name: net.ipv4.conf.all.arp_announce
    value: '0'
    sysctl_set: true
    reload: true
  when: (inventory_hostname in groups['oai_nodes']) and (inventory_hostname not in groups['master_nodes'])
  become: true

- name: set net.ipv4.conf.all.rp_filter to 2
  ansible.posix.sysctl:
    name: net.ipv4.conf.all.rp_filter
    value: '2'
    sysctl_set: true
    reload: true
  when: (inventory_hostname in groups['oai_nodes']) and (inventory_hostname not in groups['master_nodes'])
  become: true

- name: force systemd to reread configs
  systemd:
    daemon_reload: true
  when: inventory_hostname in groups['oai_nodes']
  become: true

- name: restart systemd-networkd
  systemd:
    name: systemd-networkd
    state: restarted
  when: inventory_hostname in groups['oai_nodes']
  become: true
