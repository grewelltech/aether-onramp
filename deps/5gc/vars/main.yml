# Airgap behaviour for `apt: update_cache` tasks. See vars/main.yml
# for full documentation.
airgapped:
  enabled: false                 # set true to skip `apt update_cache` (offline / mirror-only sites)

core:
  values_file: "roles/core/templates/sdcore-5g-values.yaml"

  # UPF networking. Everything here is optional: left out, the UPF's access
  # (N3) and core (N6) sides attach as macvlan children of the default-route
  # interface and this host is the gateway on both. See README.md.
  networks:
    access:
      ran_subnet: "172.20.0.0/16"   # gNB network; "" derives it from the access interface

  helm:
    local_charts: false
    chart_ref: oci://ghcr.io/omec-project/sd-core
    chart_version: 5.0.0 # Ignored if using local charts (local_charts: true)

  upf:
    mode: af_packet      # Options: af_packet or dpdk
    instances:
      default:
        ue_ip_pool: "172.250.0.0/16"
