---

- name: resolve UPF networking
  import_role:
    name: preflight
    tasks_from: upf_networks.yml
  vars:
    upf_networks_strict: false

- name: list the additional UPF instances
  ansible.builtin.set_fact:
    additional_upfs: "{{ upf_instances | dict2items | rejectattr('value.builtin') | list }}"

- name: verify helm prerequisites for 5gc/upf uninstall
  import_role:
    name: preflight
    tasks_from: helm.yml

- name: verify kubeconfig prerequisites for 5gc/upf uninstall
  import_role:
    name: preflight
    tasks_from: kubeconfig.yml
  vars:
    kubeconfig_component_name: 5GC UPF
    kubeconfig_help_text: >-
      Run the k8s provisioning flow first, or install 5GC core with a valid
      kubeconfig_source so the cluster context is bootstrapped.

- name: remove aether upfs
  kubernetes.core.helm:
    name: bess-upf
    release_namespace: aether-upf-{{ item.key }}
    state: absent
    wait: true
  loop: "{{ additional_upfs }}"
  loop_control:
    label: "{{ item.key }}"
  when: inventory_hostname in groups['master_nodes']
  ignore_errors: yes

- name: delete namespace aether-upf
  command:
    argv:
      - kubectl
      - delete
      - namespace
      - "aether-upf-{{ item.key }}"
  loop: "{{ additional_upfs }}"
  loop_control:
    label: "{{ item.key }}"
  when: inventory_hostname in groups['master_nodes']
  ignore_errors: yes
