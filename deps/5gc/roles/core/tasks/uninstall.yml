---

- name: verify helm prerequisites for 5gc/core uninstall
  import_role:
    name: preflight
    tasks_from: helm.yml

- name: verify kubeconfig prerequisites for 5gc/core uninstall
  import_role:
    name: preflight
    tasks_from: kubeconfig.yml
  vars:
    kubeconfig_component_name: 5GC core
    kubeconfig_help_text: >-
      Run the k8s provisioning flow first, or set kubeconfig_source and rerun
      the install path that bootstraps it.

- name: delete local charts from /tmp/sdcore-helm-charts/
  file:
    path: /tmp/sdcore-helm-charts/
    state: absent
  when: inventory_hostname in groups['master_nodes']  and core.helm.local_charts
  ignore_errors: yes

- name: remove aether 5gc
  kubernetes.core.helm:
    name: sd-core
    release_namespace: aether-5gc
    state: absent
    wait: true
  when: inventory_hostname in groups['master_nodes']
  ignore_errors: yes

- name: waiting for aether pods to terminate
  command:
    argv:
      - kubectl
      - wait
      - -n
      - aether-5gc
      - --for=delete
      - --all=true
      - -l
      - app!=ue
      - pod
      - --timeout=180s
  when: inventory_hostname in groups['master_nodes']
  ignore_errors: yes

- name: delete namespace aether-5gc
  command:
    argv:
      - kubectl
      - delete
      - namespace
      - aether-5gc
  when: inventory_hostname in groups['master_nodes']
  ignore_errors: yes

# Removing the unit does not turn GRO/LRO back on: the interfaces keep
# their current settings until they are recreated or the host reboots.
# The pre-install state is not recorded, and turning offloads back on
# here could affect other users of the interfaces.
- name: stop and disable aether-upf-offloads.service
  systemd:
    name: aether-upf-offloads.service
    enabled: false
    state: stopped
  when: inventory_hostname in groups['master_nodes']
  become: true
  failed_when: false

- name: remove aether-upf-offloads.service and its script
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/aether-upf-offloads.service
    - /usr/local/sbin/aether-upf-offloads
  when: inventory_hostname in groups['master_nodes']
  become: true

- name: reload systemd after removing aether-upf-offloads.service
  systemd:
    daemon_reload: true
  when: inventory_hostname in groups['master_nodes']
  become: true

